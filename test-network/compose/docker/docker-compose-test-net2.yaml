version: '3.7'
services:
  peer2.org1.example.com:
    container_name: peer2.org1.example.com
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=host
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
    extra_hosts:
      - "orderer.example.com:10.140.0.19"
      - "orderer1.example.com:10.140.0.20"
      - "orderer2.example.com:10.140.0.21"
      - "orderer3.example.com:10.140.0.22"
      - "peer0.org1.example.com:10.140.0.16"
      - "peer1.org1.example.com:10.140.0.17"
      - "peer2.org1.example.com:10.140.0.18"
