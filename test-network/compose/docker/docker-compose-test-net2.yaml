version: '3.7'
services:
  peer2.org1.example.com:
    container_name: peer2.org1.example.com
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=host
    network_mode: host
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
    extra_hosts:
      - "orderer.example.com:34.81.30.7"
      - "orderer1.example.com:34.81.10.171"
      - "orderer2.example.com:34.81.170.165"
      - "orderer3.example.com:34.81.170.165"
      - "peer0.org1.example.com:35.221.209.220"
      - "peer1.org1.example.com:35.221.209.220"
      - "peer2.org1.example.com:104.199.189.201"
