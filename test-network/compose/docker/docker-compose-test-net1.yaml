version: '3.7'
services:
  peer1.org1.example.com:
    container_name: peer1.org1.example.com
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      #Generic peer variables
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK}:/host/var/run/docker.sock
    extra_hosts:
      - "orderer.example.com:10.140.0.9"
      - "orderer1.example.com:10.140.0.2"
      - "orderer2.example.com:10.140.0.3"
      - "orderer3.example.com:10.140.0.4"
      - "peer0.org1.example.com:10.140.0.7"
      - "peer1.org1.example.com:10.140.0.6"
      - "peer2.org1.example.com:10.140.0.8"
